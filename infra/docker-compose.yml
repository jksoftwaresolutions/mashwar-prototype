# Local development services. Not a production deployment.
name: mashwar

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: mashwar
      POSTGRES_USER: mashwar
      # Local-only development password. Production credentials live in the client's secret store.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mashwar_local_dev}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mashwar -d mashwar"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-56379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
